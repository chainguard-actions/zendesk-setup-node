name: Test node-version-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .nvmrc file
        run: echo "18" > "$GITHUB_WORKSPACE/.nvmrc"
      - id: setup
        uses: .
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: 'false'
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is '$NODE_VER'"
      - name: Assert node binary is on PATH and correct version
        run: |
          ACTUAL=$(node --version)
          echo "actual node version: $ACTUAL"
          if [[ "$ACTUAL" != v18* ]]; then
            echo "FAIL: expected node v18.x but got $ACTUAL"
            exit 1
          fi
          echo "PASS"
