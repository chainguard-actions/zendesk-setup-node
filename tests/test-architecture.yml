name: Test architecture input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          node-version: '20'
          architecture: 'x64'
          package-manager-cache: 'false'
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is '$NODE_VER'"
      - name: Assert node binary is on PATH and correct version
        run: |
          ACTUAL=$(node --version)
          echo "actual node version: $ACTUAL"
          if [[ "$ACTUAL" != v20* ]]; then
            echo "FAIL: expected node v20.x but got $ACTUAL"
            exit 1
          fi
          echo "PASS"
      - name: Assert node architecture is x64
        run: |
          ARCH=$(node -e "console.log(process.arch)")
          echo "node arch: $ARCH"
          if [ "$ARCH" != "x64" ]; then
            echo "FAIL: expected x64 but got $ARCH"
            exit 1
          fi
          echo "PASS"
