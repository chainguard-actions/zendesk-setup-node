name: Test mirror input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-node
        uses: .
        with:
          node-version: '20'
          mirror: https://nodejs.org/dist
        continue-on-error: true
      - name: Assert action ran with mirror input
        env:
          OUTCOME: ${{ steps.setup-node.outcome }}
          NODE_VER: ${{ steps.setup-node.outputs.node-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "node-version: $NODE_VER"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$NODE_VER" ]; then
              echo "FAIL: action succeeded but node-version output is empty"
              exit 1
            fi
            echo "PASS: node installed via mirror, version=$NODE_VER"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (mirror may be unreachable or unsupported)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
