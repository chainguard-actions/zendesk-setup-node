name: Test npm caching
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure Node.js 24 runtime is available for the action
        run: |
          current=$(node --version 2>/dev/null || echo "v0.0.0")
          major=$(echo "$current" | cut -d. -f1 | tr -d 'v')
          echo "Current node: $current (major: $major)"
          if [ "${major:-0}" -lt 24 ] 2>/dev/null; then
            echo "Node.js < 24 detected, installing Node.js 24 via NodeSource..."
            curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash - 2>&1 || true
            sudo apt-get install -y nodejs 2>&1 || true
          fi
          echo "Node version after setup: $(node --version)"
      - name: Create package-lock.json for cache key generation
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" <<'EOF'
          {
            "name": "test-app",
            "version": "1.0.0",
            "dependencies": {}
          }
          EOF
          cat > "$GITHUB_WORKSPACE/package-lock.json" <<'EOF'
          {
            "name": "test-app",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "name": "test-app",
                "version": "1.0.0"
              }
            }
          }
          EOF
      - id: setup
        uses: .
        with:
          node-version: '20'
          cache: 'npm'
      - name: Assert node-version output is set
        env:
          NODE_VER: ${{ steps.setup.outputs.node-version }}
        run: |
          echo "node-version output: $NODE_VER"
          if [ -z "$NODE_VER" ]; then
            echo "FAIL: node-version output is empty"
            exit 1
          fi
          echo "PASS: node-version output is '$NODE_VER'"
      - name: Assert cache-primary-key output or cache unavailable
        env:
          CACHE_KEY: ${{ steps.setup.outputs.cache-primary-key }}
        run: |
          echo "cache-primary-key: $CACHE_KEY"
          # cache-primary-key is only set when the cache service is available.
          # In act, the cache service may not be available, so we accept either
          # a non-empty key (cache available) or an empty key (cache unavailable).
          if [ -n "$CACHE_KEY" ]; then
            echo "PASS: cache-primary-key is '$CACHE_KEY'"
          else
            echo "INFO: cache-primary-key is empty (cache service not available in this environment)"
            echo "PASS: acceptable - cache service unavailable"
          fi
      - name: Assert node binary is on PATH
        run: |
          ACTUAL=$(node --version)
          echo "node --version: $ACTUAL"
          if [[ "$ACTUAL" != v20* ]]; then
            echo "FAIL: expected node v20.x, got $ACTUAL"
            exit 1
          fi
          echo "PASS"
